<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIR Research — 空間環境モニタリング</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #0f1923;
      color: #e8edf2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .logo { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #2ecc71; margin-bottom: 8px; }
    h1 { font-size: clamp(22px, 4vw, 36px); font-weight: 700; text-align: center; line-height: 1.3; margin-bottom: 10px; }
    .sub { color: #8a9bb0; font-size: 13px; text-align: center; line-height: 1.7; max-width: 480px; margin-bottom: 40px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 760px;
      margin-bottom: 40px;
    }
    .card {
      background: #1a2533;
      border: 1px solid #2a3a4d;
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: border-color .2s, transform .2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover { border-color: #2ecc71; transform: translateY(-2px); }
    .card .icon { font-size: 28px; }
    .card .c-title { font-size: 15px; font-weight: 700; }
    .card .c-desc { font-size: 12px; color: #8a9bb0; line-height: 1.6; }
    .card .c-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #1e3a28;
      color: #2ecc71;
      align-self: flex-start;
    }
    .card .c-badge.live { background: #2ecc71; color: #0f1923; }
    .updated { font-size: 11px; color: #4a5a6a; }
  </style>
</head>
<body>
  <div class="logo">AIR Research</div>
  <h1>空間環境モニタリング<br>ダッシュボード</h1>
  <p class="sub">「なんとなく不快」を数値化する。<br>センサーデータのリアルタイム閲覧と調査レポートの確認ができます。</p>

  <div class="cards">
    <a class="card" href="https://lookerstudio.google.com/your-dashboard-id" target="_blank">
      <span class="icon">📊</span>
      <span class="c-title">ライブダッシュボード</span>
      <span class="c-desc">Looker Studio でリアルタイムデータを確認。センサー別・時間帯別の傾向分析。</span>
      <span class="c-badge live">LIVE</span>
    </a>
    <a class="card" href="index.html">
      <span class="icon">📄</span>
      <span class="c-title">本日の分析レポート</span>
      <span class="c-desc">自動生成された当日分の体感不快指数・原因分析・改善提言レポート。</span>
      <span class="c-badge">Today</span>
    </a>
    <a class="card" href="template.html">
      <span class="icon">📋</span>
      <span class="c-title">A4納品レポート雛形</span>
      <span class="c-desc">クライアント向けA4×2枚の印刷用レポートテンプレート。</span>
      <span class="c-badge">PDF用</span>
    </a>
  </div>

  <div class="updated" id="updated"></div>

  <script>
    document.getElementById('updated').textContent =
      '最終更新: ' + new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
  </script>
</body>
</html>

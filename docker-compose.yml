services:
  oracle:
    image: gvenzl/oracle-free:23
    container_name: air-research-db
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: airresearch
    volumes:
      - ./db/init:/container-entrypoint-initdb.d
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "air_app/air_pass@//localhost:1521/FREEPDB1", "@health.sql"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  oracle_data:
